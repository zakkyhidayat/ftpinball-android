name: Android CI

on:
  push:
    branches: [ "android", "code-improvements" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # The Full Tilt! data is copyrighted and is not in the repository: this builds the app without it
    - name: Unit tests
      run: ./gradlew testDebugUnitTest
    - name: Build debug APK
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: no-data-apk
        path: app/build/outputs/apk/debug/*.apk
